name: Build and Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag name to release, e.g. v1.0.0'
        required: true
      draft:
        description: 'Create as draft release'
        required: true
        default: 'true'
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'maven'

      - name: Write Maven settings.xml with Central mirror
        run: |
          mkdir -p "$HOME/.m2"
          cat > "$HOME/.m2/settings.xml" <<'EOF'
          <settings xmlns="http://maven.apache.org/SETTINGS/1.2.0"
                    xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance"
                    xsi:schemaLocation="http://maven.apache.org/SETTINGS/1.2.0 https://maven.apache.org/xsd/settings-1.2.0.xsd">
            <mirrors>
              <mirror>
                <id>central-repo1</id>
                <name>Maven Central via repo1</name>
                <url>https://repo1.maven.org/maven2/</url>
                <mirrorOf>central</mirrorOf>
              </mirror>
            </mirrors>
          </settings>
          EOF

      - name: Build with Maven
        run: mvn -B -ntp -DskipTests package

      - name: Collect artifacts
        env:
          RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          mkdir -p out
          ARTIFACT_ID=$(mvn -q -DforceStdout help:evaluate -Dexpression=project.artifactId)
          # copy shaded jar if present, otherwise normal jar
          ls -la target || true
          for jar in target/*.jar; do
            [ -e "$jar" ] || continue
            cp -v "$jar" "out/${ARTIFACT_ID}-${RELEASE_TAG}.jar"
          done

      - name: Create GitHub Release
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          draft: ${{ github.event.inputs.draft || 'false' }}
          generate_release_notes: true
          files: |
            out/*.jar
